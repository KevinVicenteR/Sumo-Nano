; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nano

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
; upload_port = auto-detect en Windows
upload_speed = 115200
monitor_speed = 9600

# arduino nano

; Lecturas de sensores por Serial, motores detenidos.
[env:calibracion]
extends = env:nano
build_flags = -DMODO_CALIBRACION=1

; Combate con registro CSV no bloqueante (motores habilitados por RUN).
[env:registro]
extends = env:nano
build_flags = -DREGISTRO_COMBATE=1
monitor_speed = 115200

[env:round1]
extends = env:nano
build_flags = -DROUND_COMPETENCIA=1

[env:round2]
extends = env:nano
build_flags = -DROUND_COMPETENCIA=2

[env:round3]
extends = env:nano
build_flags = -DROUND_COMPETENCIA=3
