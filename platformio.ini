[platformio]
default_envs = nano

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
upload_speed = 115200
monitor_speed = 9600
test_framework = custom

[env:calibracion]
extends = env:nano
build_flags = -DMODO_CALIBRACION=1

[env:registro]
extends = env:nano
build_flags = -DREGISTRO_COMBATE=1
monitor_speed = 115200
